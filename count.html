<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>

    <style>
    /* Style for the whole page */
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    /* Heading */
    .title {
        margin-top: 100px;
        color: #333;
        font-size: 32px;
    }

    /* Counter number */
    #count {
        font-size: 60px;
        font-weight: bold;
        color: #2563eb;
        margin: 30px 0;
    }

    /* Buttons */
    .button {
        padding: 12px 25px;
        margin: 10px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    /* Button hover effect */
    .button:hover {
        background-color: #1d4ed8;
        transform: scale(1.05);
    }

    /* Button click effect */
    .button:active {
        transform: scale(0.95);
    }
</style>

</head>
<body>

    <h1 class="title">Counter using DOM manipulation</h1>

    <p id="count">0</p>

    <button class="button">Increment</button>
    <button class="button">Decrement</button>

    <script>

        let count=document.getElementById("count")
        let button=document.getElementsByClassName("button")[0]
        let button2=document.getElementsByClassName("button")[1]

        button.addEventListener("click",
            function(){
                count.textContent=Number(count.textContent)+1
            }
        )

        button2.addEventListener("click",
            function(){
                count.textContent=Number(count.textContent)-1
            }
        )
    </script>
    
</body>
</html>
